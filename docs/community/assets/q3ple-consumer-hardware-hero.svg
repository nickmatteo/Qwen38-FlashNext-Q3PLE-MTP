<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.55" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#111B35"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="0.52" stop-color="#62D8FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121D34"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#8CB9FF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1420" cy="105" r="310" fill="#62D8FF" opacity="0.075"/>
  <circle cx="138" cy="835" r="360" fill="#7CFFB2" opacity="0.06"/>
  <path d="M1135 -20 C1300 160 1390 225 1620 300" fill="none" stroke="url(#hero)" stroke-width="3" opacity="0.25"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="86" y="72" fill="#91A4C7" font-size="24" font-weight="700" letter-spacing="3">QWEN3.8-FLASH-NEXT  /  QWEN4 ARCHITECTURE PREVIEW</text>

    <rect x="86" y="105" width="548" height="48" rx="24" fill="#111C2F" stroke="#304561"/>
    <text x="112" y="137" fill="#DCE9FF" font-size="22" font-weight="800" letter-spacing="1.2">NO 3090  •  NO DDR5  •  NO SECOND GPU</text>

    <text x="82" y="249" fill="#FFFFFF" font-size="77" font-weight="900" letter-spacing="-2">FRONTIER-WEIGHT</text>
    <text x="82" y="332" fill="url(#hero)" font-size="77" font-weight="900" letter-spacing="-2">INFERENCE ON 12 GB VRAM</text>
    <text x="87" y="386" fill="#B8C7DF" font-size="30" font-weight="500">Q3_PLE quantization + learned MTP + restartable long-context state</text>

    <g filter="url(#shadow)">
      <rect x="1150" y="100" width="362" height="300" rx="30" fill="url(#card)" stroke="#2B4264" stroke-width="2"/>
      <text x="1192" y="151" fill="#91A4C7" font-size="20" font-weight="800" letter-spacing="2">THE ACTUAL MACHINE</text>
      <line x1="1192" y1="171" x2="1470" y2="171" stroke="#2A405F"/>
      <text x="1192" y="214" fill="#FFFFFF" font-size="29" font-weight="800">RTX 5070</text>
      <text x="1470" y="214" fill="#7CFFB2" font-size="27" font-weight="900" text-anchor="end">12 GB</text>
      <text x="1192" y="262" fill="#FFFFFF" font-size="29" font-weight="800">DDR4-3000</text>
      <text x="1470" y="262" fill="#62D8FF" font-size="27" font-weight="900" text-anchor="end">64 GB</text>
      <text x="1192" y="310" fill="#FFFFFF" font-size="29" font-weight="800">Ryzen 9</text>
      <text x="1470" y="310" fill="#A78BFA" font-size="27" font-weight="900" text-anchor="end">5900XT</text>
      <text x="1192" y="358" fill="#FFFFFF" font-size="29" font-weight="800">Storage</text>
      <text x="1470" y="358" fill="#FFBE74" font-size="27" font-weight="900" text-anchor="end">NVMe</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="86" y="454" width="690" height="300" rx="34" fill="url(#card)" stroke="#2B4264" stroke-width="2"/>
      <text x="132" y="514" fill="#91A4C7" font-size="22" font-weight="800" letter-spacing="2">CONTROLLED SHORT-PROMPT PROFILE</text>
      <text x="128" y="636" fill="url(#hero)" font-size="124" font-weight="900" letter-spacing="-4">31.45</text>
      <text x="548" y="636" fill="#FFFFFF" font-size="44" font-weight="800">tok/s</text>
      <text x="132" y="693" fill="#E6EEFA" font-size="29" font-weight="700">mean of two clean runs</text>
      <text x="132" y="720" fill="#9FB0CA" font-size="21">16K allocated • 232 prompt • 171 generated</text>
      <text x="132" y="746" fill="#9FB0CA" font-size="21">129/129 drafts accepted • 776 MiB minimum free VRAM</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="824" y="454" width="688" height="300" rx="34" fill="url(#card)" stroke="#2B4264" stroke-width="2"/>
      <text x="870" y="514" fill="#91A4C7" font-size="22" font-weight="800" letter-spacing="2">RESTARTABLE AGENT STATE</text>
      <text x="866" y="626" fill="url(#hero)" font-size="105" font-weight="900" letter-spacing="-3">59,750</text>
      <text x="870" y="678" fill="#FFFFFF" font-size="34" font-weight="800">actual occupied tokens</text>
      <text x="870" y="714" fill="#9FB0CA" font-size="21">fresh-process restore • paired target + MTP state</text>
      <text x="870" y="742" fill="#9FB0CA" font-size="21">no replay of the earlier 16K / 32K / 47K prefix</text>
    </g>

    <rect x="86" y="798" width="1426" height="54" rx="27" fill="#090F1B" stroke="#263A56"/>
    <text x="799" y="833" fill="#C8D5E8" font-size="22" font-weight="700" text-anchor="middle">
      These are separate measurements. The repo preserves the raw evidence, failures, hashes, and rejected speedups.
    </text>
  </g>
</svg>
