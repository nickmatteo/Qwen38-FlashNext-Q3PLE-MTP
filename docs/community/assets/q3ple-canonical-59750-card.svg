<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65f4c4"/>
      <stop offset="1" stop-color="#58b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="90" r="260" fill="#58b8ff" opacity="0.08"/>
  <circle cx="80" cy="840" r="310" fill="#65f4c4" opacity="0.06"/>

  <text x="90" y="82" fill="#8ea8c1" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="3">QWEN3.8-FLASH-NEXT Q3_PLE + LEARNED MTP</text>
  <text x="90" y="142" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">A 125B-class MoE on an RTX 5070 12GB</text>

  <g filter="url(#shadow)">
    <rect x="90" y="195" width="675" height="420" rx="34" fill="#102238" stroke="#24415c" stroke-width="2"/>
    <text x="140" y="260" fill="#8ea8c1" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">CONTROLLED THROUGHPUT</text>
    <text x="140" y="395" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="126" font-weight="800">31.45</text>
    <text x="585" y="395" fill="#d9e9f5" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">tok/s</text>
    <text x="140" y="468" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="650">Mean of two clean runs</text>
    <text x="140" y="520" fill="#a9bfd1" font-family="Segoe UI, Arial, sans-serif" font-size="27">16K allocation</text>
    <text x="140" y="563" fill="#a9bfd1" font-family="Segoe UI, Arial, sans-serif" font-size="27">232-token prompt, 171-token completion</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="195" width="675" height="420" rx="34" fill="#102238" stroke="#24415c" stroke-width="2"/>
    <text x="885" y="260" fill="#8ea8c1" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">CANONICAL AGENT STATE</text>
    <text x="885" y="380" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="108" font-weight="800">59,750</text>
    <text x="885" y="440" fill="#d9e9f5" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">occupied tokens</text>
    <text x="885" y="500" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="650">Fresh-process restore, no prefix replay</text>
    <text x="885" y="548" fill="#a9bfd1" font-family="Segoe UI, Arial, sans-serif" font-size="26">Exact retrieval text + token parity</text>
    <text x="885" y="588" fill="#a9bfd1" font-family="Segoe UI, Arial, sans-serif" font-size="26">10/11 MTP drafts accepted</text>
  </g>

  <rect x="90" y="670" width="1420" height="128" rx="26" fill="#081521" stroke="#2f536e" stroke-width="2"/>
  <text x="130" y="720" fill="#ffcb6b" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">THE RESULT WE REJECTED</text>
  <text x="130" y="765" fill="#e7f1f8" font-family="Segoe UI, Arial, sans-serif" font-size="29">Code MTP: 22.30 vs 18.15 tok/s warm, but exact output changed. Not promoted as a speed win.</text>

  <text x="90" y="852" fill="#8ea8c1" font-family="Segoe UI, Arial, sans-serif" font-size="23">RTX 5070 12GB  |  64GB DDR4  |  81,920-token daily allocation  |  Raw JSON + SHA-256 preserved</text>
</svg>
