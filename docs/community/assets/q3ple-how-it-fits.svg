<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="1" stop-color="#101A30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="0.55" stop-color="#62D8FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#62D8FF"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#9CC7FF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1510" cy="760" r="320" fill="#A78BFA" opacity="0.06"/>
  <circle cx="65" cy="130" r="280" fill="#7CFFB2" opacity="0.05"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="82" y="72" fill="#91A4C7" font-size="23" font-weight="800" letter-spacing="2.7">HOW IT FITS</text>
    <text x="82" y="142" fill="#FFFFFF" font-size="55" font-weight="900" letter-spacing="-1.3">12 GB VRAM never holds the whole model.</text>
    <text x="82" y="192" fill="#B8C7DF" font-size="28">The win comes from changing one giant tensor family, then placing each part where it hurts least.</text>

    <g filter="url(#shadow)">
      <rect x="80" y="255" width="385" height="470" rx="30" fill="#101A2E" stroke="#2A405F" stroke-width="2"/>
      <text x="116" y="310" fill="#91A4C7" font-size="20" font-weight="800" letter-spacing="2">STARTING TARGET</text>
      <text x="116" y="365" fill="#FFFFFF" font-size="36" font-weight="900">AtomicChat 4.27-bpw</text>
      <text x="116" y="409" fill="#B6C5DA" font-size="24">mixed neural quant</text>
      <line x1="116" y1="445" x2="429" y2="445" stroke="#2C4261"/>
      <text x="116" y="497" fill="#FFFFFF" font-size="27" font-weight="800">125B main parameters</text>
      <text x="116" y="541" fill="#FFFFFF" font-size="27" font-weight="800">51.2B PLE elements</text>
      <text x="116" y="585" fill="#7CFFB2" font-size="27" font-weight="900">~6B active / token</text>
      <rect x="106" y="632" width="330" height="58" rx="16" fill="#0A1220" stroke="#324A6B"/>
      <text x="271" y="669" fill="#DCE7F7" font-size="18" font-weight="700" text-anchor="middle">The PLE table is the pressure point</text>
    </g>

    <path d="M480 490 L545 490" stroke="#62D8FF" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="555" y="255" width="485" height="470" rx="30" fill="#101A2E" stroke="#2A405F" stroke-width="2"/>
      <text x="591" y="310" fill="#91A4C7" font-size="20" font-weight="800" letter-spacing="2">CHANGE EXACTLY ONE FAMILY</text>
      <rect x="591" y="348" width="413" height="122" rx="22" fill="#0A1322" stroke="#2E4667"/>
      <text x="619" y="389" fill="#FFFFFF" font-size="28" font-weight="900">1,223 neural tensors</text>
      <text x="619" y="430" fill="#7CFFB2" font-size="24" font-weight="800">56.11 GB • byte-identical</text>

      <rect x="591" y="494" width="413" height="158" rx="22" fill="#0A1322" stroke="#2E4667"/>
      <text x="619" y="536" fill="#FFFFFF" font-size="28" font-weight="900">PLE / n-gram table</text>
      <text x="619" y="579" fill="#62D8FF" font-size="24" font-weight="900">Q5_1 → project Q3_PLE</text>
      <text x="619" y="619" fill="#B8C7DF" font-size="23">22.40 GB payload • 3.5-bit blocks</text>

      <text x="797" y="690" fill="#A78BFA" font-size="25" font-weight="900" text-anchor="middle">33-shard target: 78.53 GB</text>
    </g>

    <path d="M1054 490 L1119 490" stroke="#62D8FF" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="1130" y="255" width="390" height="470" rx="30" fill="#101A2E" stroke="#2A405F" stroke-width="2"/>
      <text x="1166" y="310" fill="#91A4C7" font-size="20" font-weight="800" letter-spacing="2">RUN IT AS A SYSTEM</text>

      <rect x="1166" y="346" width="318" height="76" rx="19" fill="#0A1322" stroke="#304966"/>
      <text x="1194" y="378" fill="#FFFFFF" font-size="24" font-weight="900">NVMe + mmap</text>
      <text x="1194" y="405" fill="#A9B8CE" font-size="18">cold weight backing</text>

      <rect x="1166" y="440" width="318" height="76" rx="19" fill="#0A1322" stroke="#304966"/>
      <text x="1194" y="472" fill="#FFFFFF" font-size="24" font-weight="900">64 GB DDR4</text>
      <text x="1194" y="499" fill="#A9B8CE" font-size="18">host-resident routed work</text>

      <rect x="1166" y="534" width="318" height="76" rx="19" fill="#0A1322" stroke="#304966"/>
      <text x="1194" y="566" fill="#FFFFFF" font-size="24" font-weight="900">RTX 5070 12 GB</text>
      <text x="1194" y="593" fill="#A9B8CE" font-size="18">latency-critical target path</text>

      <rect x="1166" y="628" width="318" height="76" rx="19" fill="#0A1322" stroke="#304966"/>
      <text x="1194" y="660" fill="#FFFFFF" font-size="24" font-weight="900">2.20 GB MTP sidecar</text>
      <text x="1194" y="687" fill="#A9B8CE" font-size="18">detached learned draft head</text>
    </g>

    <rect x="80" y="774" width="1440" height="72" rx="24" fill="#090F1C" stroke="#2B4262"/>
    <text x="800" y="818" fill="#D7E3F4" font-size="24" font-weight="800" text-anchor="middle">
      This is host-memory inference with aggressive placement—not a claim that a 78.5 GB target lives inside 12 GB of VRAM.
    </text>
  </g>
</svg>
