<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="1" stop-color="#101A30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="0.55" stop-color="#62D8FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#9CC7FF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="40" r="260" fill="#FFBE74" opacity="0.05"/>
  <circle cx="90" cy="860" r="280" fill="#7CFFB2" opacity="0.05"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="82" y="70" fill="#91A4C7" font-size="22" font-weight="800" letter-spacing="2.8">ACTUAL 59,750-TOKEN DEPTH  /  THREE-REPEAT TARGET-FIRST TESTS</text>
    <text x="82" y="142" fill="#FFFFFF" font-size="58" font-weight="900" letter-spacing="-1.4">The speedup we refused to advertise.</text>
    <text x="82" y="190" fill="#B8C7DF" font-size="27">A faster number only counts when the correctness contract survives.</text>

    <g filter="url(#shadow)">
      <rect x="80" y="238" width="1440" height="170" rx="28" fill="#101A2E" stroke="#2A405F" stroke-width="2"/>
      <rect x="80" y="238" width="18" height="170" rx="9" fill="#7CFFB2"/>
      <text x="130" y="285" fill="#FFFFFF" font-size="31" font-weight="900">RETRIEVAL</text>
      <text x="130" y="322" fill="#AABAD1" font-size="20">Exact text + token parity</text>
      <text x="130" y="350" fill="#AABAD1" font-size="20">10/11 drafts accepted</text>

      <text x="606" y="276" fill="#AABAD1" font-size="18" font-weight="800">TARGET</text>
      <rect x="606" y="293" width="390" height="31" rx="15" fill="#1B2A43"/>
      <rect x="606" y="293" width="297" height="31" rx="15" fill="#566A88"/>
      <text x="1014" y="317" fill="#FFFFFF" font-size="22" font-weight="900">18.25 tok/s</text>

      <text x="606" y="348" fill="#AABAD1" font-size="18" font-weight="800">MTP</text>
      <rect x="606" y="365" width="390" height="31" rx="15" fill="#1B2A43"/>
      <rect x="606" y="365" width="299" height="31" rx="15" fill="#7CFFB2"/>
      <text x="1014" y="389" fill="#FFFFFF" font-size="22" font-weight="900">18.34 tok/s</text>

      <rect x="1263" y="278" width="205" height="84" rx="21" fill="#0B2018" stroke="#2E7B58"/>
      <text x="1365" y="312" fill="#7CFFB2" font-size="20" font-weight="900" text-anchor="middle">PASS EXACT</text>
      <text x="1365" y="340" fill="#D9E7DF" font-size="17" font-weight="700" text-anchor="middle">no speed claim</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="80" y="432" width="1440" height="190" rx="28" fill="#101A2E" stroke="#2A405F" stroke-width="2"/>
      <rect x="80" y="432" width="18" height="190" rx="9" fill="#FFBE74"/>
      <text x="130" y="481" fill="#FFFFFF" font-size="31" font-weight="900">CODE</text>
      <text x="130" y="518" fill="#AABAD1" font-size="20">Outputs were usable</text>
      <text x="130" y="546" fill="#AABAD1" font-size="20">Exact text + token vectors changed</text>

      <text x="606" y="469" fill="#AABAD1" font-size="18" font-weight="800">TARGET</text>
      <rect x="606" y="486" width="390" height="31" rx="15" fill="#1B2A43"/>
      <rect x="606" y="486" width="295" height="31" rx="15" fill="#566A88"/>
      <text x="1014" y="510" fill="#FFFFFF" font-size="22" font-weight="900">18.15 tok/s</text>

      <text x="606" y="542" fill="#AABAD1" font-size="18" font-weight="800">MTP</text>
      <rect x="606" y="559" width="390" height="31" rx="15" fill="#1B2A43"/>
      <rect x="606" y="559" width="362" height="31" rx="15" fill="#FFBE74"/>
      <text x="1014" y="583" fill="#FFFFFF" font-size="22" font-weight="900">22.30 tok/s</text>

      <rect x="1235" y="476" width="253" height="101" rx="21" fill="#24190A" stroke="#8C642B"/>
      <text x="1362" y="512" fill="#FFBE74" font-size="19" font-weight="900" text-anchor="middle">+22.9% REJECTED</text>
      <text x="1362" y="541" fill="#F4E7D5" font-size="17" font-weight="700" text-anchor="middle">output changed</text>
      <text x="1362" y="564" fill="#C7B79F" font-size="15" text-anchor="middle">not a promoted win</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="80" y="646" width="1440" height="120" rx="28" fill="#101A2E" stroke="#2A405F" stroke-width="2"/>
      <rect x="80" y="646" width="18" height="120" rx="9" fill="#8393AD"/>
      <text x="130" y="696" fill="#FFFFFF" font-size="31" font-weight="900">PROSE</text>
      <text x="130" y="738" fill="#AABAD1" font-size="21">Target returned 90 words for a requested 170–210 • target-first gate failed • MTP was not run</text>
      <rect x="1248" y="671" width="240" height="70" rx="20" fill="#121924" stroke="#536179"/>
      <text x="1368" y="714" fill="#C3CDDB" font-size="20" font-weight="900" text-anchor="middle">STOP AT TARGET</text>
    </g>

    <rect x="80" y="804" width="1440" height="52" rx="26" fill="#090F1C" stroke="#2B4262"/>
    <text x="800" y="837" fill="url(#accent)" font-size="23" font-weight="900" text-anchor="middle">
      Project rule: speed is evidence only after exactness, resource floors, and repeatability pass.
    </text>
  </g>
</svg>
